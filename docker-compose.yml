services:
  web:
    image: ouroboros-web
    container_name: ouroboros-app
    build:
      context: .
      # Embutidas no bundle durante o build — ver o comentário no Dockerfile.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
