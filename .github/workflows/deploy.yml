name: Deploy

# Push na master: migration primeiro, deploy depois.
#
# O TODO.md previa dois arquivos (`migrations.yml` e `deploy.yml`) encadeados
# com `needs:`. `needs:` só existe entre jobs do MESMO workflow, e a alternativa
# (`workflow_run`) roda em outro contexto e falha em silêncio. Então virou um
# arquivo com dois jobs, que é o encadeamento que o TODO pedia. O
# `supabase db lint` do PR ficou no ci.yml.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Deploy não cancela deploy: um `db push` interrompido no meio deixa o banco
# num estado que ninguém registrou.
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  migrations:
    name: Aplicar migrations no Supabase
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link com o projeto
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # `--include-all` para não parar numa migration fora de ordem cronológica,
      # que acontece sempre que dois PRs com migration são mergeados de véspera.
      - name: db push
        run: supabase db push --include-all

  deploy:
    name: Publicar no Cloudflare Pages
    # A migration roda ANTES: subir um bundle que espera uma coluna que ainda
    # não existe é o jeito mais barato de derrubar todo mundo.
    needs: migrations
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Sentry. Tudo aqui é opcional por construção: sem `NEXT_PUBLIC_SENTRY_DSN` o SDK não
      # inicializa, e sem `SENTRY_AUTH_TOKEN` o build não gera nem sobe sourcemap. Então o
      # deploy continua verde enquanto os projetos do Sentry não existirem.
      # O DSN é público (só permite escrever evento, não ler), igual à anon key; o
      # AUTH_TOKEN é segredo de verdade e por isso NÃO é `NEXT_PUBLIC_`.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
      # Amarra a issue ao commit exato que a causou.
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # Só na região EU do Sentry; vazio usa sentry.io.
      SENTRY_URL: ${{ vars.SENTRY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `output: 'export'` faz isto gerar `out/`, estático puro.
      - run: npm run build

      # Guarda de sourcemap: o plugin do Sentry já apaga os `.map` de `.next/static` depois de
      # subir, mas o `next build` copia esse diretório para `out/_next/static` no mesmo comando
      # e a ordem entre as duas coisas não é contratual. Publicar `.map` no Pages é publicar o
      # código-fonte, então a garantia fica aqui, uma linha antes do deploy.
      - name: Garantir que nenhum sourcemap vá para o Pages
        run: find out -name '*.map' -delete -print

      - name: wrangler pages deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=master
